<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0e11">
<title>Good Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0e11;--ink:#eceae4;--muted:#8d8c86;--line:#262830;--card:#15171b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);color-scheme:dark}
  body{margin:0;font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-touch-callout:none;
    padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  h1{margin:0 0 4px;font-weight:600;font-size:24px;letter-spacing:-.02em}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px;text-align:center;max-width:420px;line-height:1.45}
  .board{display:flex;gap:8px;width:min(620px,100%)}
  .col{flex:1;position:relative;touch-action:none;user-select:none;cursor:grab;outline:none;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  .col:focus-visible{box-shadow:0 0 0 2px var(--ink)}
  .col svg{display:block;width:100%;height:auto}
  .labels{display:flex;gap:8px;width:min(620px,100%);margin-top:14px}
  .lab{flex:1;text-align:center;font-size:13px;font-weight:500}
  .lab .nm{display:inline-flex;align-items:center;gap:6px}
  .lab .nm i{width:8px;height:8px;border-radius:50%}
  .lab small{display:block;font-weight:400;font-size:11px;line-height:1.3;color:var(--muted);padding:0 4px}
  .lab .num{display:inline-block;font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0;transition:transform .15s}
  .lab .num.pulse{transform:scale(1.2)}
  .panel{width:min(620px,100%);margin-top:24px;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
  .panel h2{margin:0 0 10px;font-size:14px;font-weight:600}
  .panel h2 small{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
  textarea{display:block;width:100%;min-height:110px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;-webkit-appearance:none;appearance:none}
  textarea::placeholder{color:#6b6a65}
  textarea:focus{border-color:#8d8c86;background:#101216}
  .actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;font-weight:500;font-size:15px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#0d0e11;cursor:pointer;touch-action:manipulation}
  button:active{transform:scale(.98)}
  button.ghost{background:transparent;color:var(--ink);border-color:#3a3d45}
  .hint{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
  .entry{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .entry:first-of-type{border-top:0;padding-top:0}
  .row{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
  .d{color:var(--muted);min-width:104px}
  .dots{display:flex;gap:12px;flex:1}
  .dot{display:flex;align-items:center;gap:4px;font-weight:500;font-variant-numeric:tabular-nums}
  .dot i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .note{margin:2px 0 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  button.x{margin-left:auto;padding:0;width:32px;min-height:32px;height:32px;font-size:18px;line-height:1;border-radius:50%;background:transparent;color:var(--muted);border:1px solid var(--line)}
  @media (max-width:480px){.board,.labels{gap:6px}.col{border-radius:10px}.lab small{font-size:10px}.lab .num{font-size:24px}.d{min-width:0}}
</style>
</head>
<body>
<h1>Good Time Tracker</h1>
<p class="sub">Slide each climber to where you are right now. There is no goal height. This is just a way to notice.</p>

<div class="board" id="board"></div>
<div class="labels" id="labels"></div>

<div class="panel">
  <h2>Journal <small>optional</small></h2>
  <textarea id="note" rows="4" placeholder="What's behind where you are today? What's lifting or weighing on each area?" aria-label="Journal entry"></textarea>
</div>

<div class="actions">
  <button id="save">Save check-in</button>
  <button class="ghost" id="reset">Reset climbers</button>
</div>
<div class="hint" id="msg">&nbsp;</div>

<div class="panel">
  <h2>Past check-ins</h2>
  <div id="log"><div class="hint">No check-ins saved yet.</div></div>
</div>

<script>
const CATS=[
  {key:"engagement",name:"Engagement",sub:"absorbed in what I'm doing",color:"#d93a3a"},
  {key:"energy",name:"Energy",sub:"physically & mentally charged",color:"#1f9d55"},
  {key:"purpose",name:"Purpose",sub:"it mattered / had meaning",color:"#eab812"},
  {key:"joy",name:"Joy",sub:"I enjoyed it",color:"#2f55d4"}
];
const LEVELS=10, W=140, H=470, TOP=54, BOT=H-66, CX=W/2;
const ARM1=16, ARM2=17, LEG1=19, LEG2=19, ARM_R=31, LEG_R=36;
const INK="#f1efe8", SVGNS="http://www.w3.org/2000/svg";
const f=n=>n.toFixed(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const yFor=l=>BOT-(l-1)*(BOT-TOP)/(LEVELS-1);
const levelFor=y=>clamp(Math.round(1+(BOT-y)*(LEVELS-1)/(BOT-TOP)),1,LEVELS);
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ---------- state + storage ---------- */
const LOGKEY="gtt-log-v1", CURKEY="gtt-current-v1", DRAFTKEY="gtt-draft-v1";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const state={}; CATS.forEach(c=>state[c.key]=1);
const saved=lsGet(CURKEY); if(saved) CATS.forEach(c=>{if(saved[c.key]>=1&&saved[c.key]<=LEVELS) state[c.key]=saved[c.key]});

/* ---------- holds ---------- */
function blobPath(cx,cy,r,asp,rot,rand){
  const n=9,pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, rr=r*(0.74+0.4*rand());
    const x=Math.cos(a)*rr*asp, y=Math.sin(a)*rr, cr=Math.cos(rot), sr=Math.sin(rot);
    pts.push([cx+x*cr-y*sr, cy+x*sr+y*cr]);
  }
  let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d+"Z";
}
function makeHolds(seed){
  const r=rng(seed),holds=[];
  for(let y=34;y<H-34;y+=16.5){
    const zones=[[20,50],[52,88],[90,120]].sort(()=>r()-.5);
    const count=r()<.35?2:1;
    for(let k=0;k<count;k++){
      const z=zones[k], x=z[0]+r()*(z[1]-z[0]), yy=y+r()*8-4, t=r();
      let size,asp,rot=(r()-.5)*1.4;
      if(t<.3){size=6.5+r()*2.5;asp=1.05}
      else if(t<.5){size=4.2+r()*1.4;asp=1.9;rot*=.4}
      else if(t<.68){size=7.2+r()*2;asp=1.25}
      else if(t<.82){size=4.6+r()*1.2;asp=.55;rot*=.5}
      else {size=3.6+r()*1.2;asp=1.1}
      holds.push({x,y:yy,d:blobPath(x,yy,size,asp,rot,r)});
    }
  }
  return holds;
}

/* ---------- build ---------- */
const board=document.getElementById("board"), labels=document.getElementById("labels");
const cols={};
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const line=(parent,w,extra)=>mk("polyline",Object.assign({fill:"none",stroke:INK,"stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round"},extra||{}),parent);

CATS.forEach((c,i)=>{
  const holds=makeHolds(i*131+17);
  let holdSvg="";
  holds.forEach(h=>{holdSvg+=`<path d="${h.d}" fill="${c.color}"/>`});
  let ticks="";
  for(let l=1;l<=LEVELS;l++) ticks+=`<text x="4" y="${f(yFor(l)+2)}" font-family="Space Grotesk,sans-serif" font-size="6" fill="#55575f">${l}</text>`;

  const col=document.createElement("div");
  col.className="col";col.tabIndex=0;col.setAttribute("role","slider");
  col.setAttribute("aria-label",c.name);col.setAttribute("aria-valuemin",1);col.setAttribute("aria-valuemax",LEVELS);
  col.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <rect width="${W}" height="${H}" fill="#14161a"/>
    <rect class="fill" x="0" width="${W}" fill="${c.color}" opacity=".13"/>
    ${ticks}
    ${holdSvg}
    <rect x="0" y="${H-18}" width="${W}" height="18" fill="#1b1d22"/>
    <line x1="0" y1="${H-18}" x2="${W}" y2="${H-18}" stroke="#2c2f37" stroke-width="1"/>
    <circle cx="${CX}" cy="11" r="3.2" fill="none" stroke="#8d8c86" stroke-width="1.6"/>
    <g class="ropes"></g>
    <g class="climber"></g>
  </svg>`;
  board.appendChild(col);

  const lab=document.createElement("div");lab.className="lab";
  lab.innerHTML=`<span class="nm"><i style="background:${c.color}"></i>${c.name}</span><br><span class="num">${state[c.key]}</span><small>${c.sub}</small>`;
  labels.appendChild(lab);

  const ropes=col.querySelector(".ropes"), g=col.querySelector(".climber");
  const E={};
  E.slack=mk("path",{fill:"none",stroke:"#3a3d45","stroke-width":1.4,"stroke-linecap":"round"},ropes);
  E.rope=mk("path",{fill:"none",stroke:"#9a9ca6","stroke-width":1.4,"stroke-linecap":"round"},ropes);
  E.legL=line(g,2.4); E.legR=line(g,2.4);
  E.footL=line(g,2.4); E.footR=line(g,2.4);
  E.torso=line(g,2.6);
  E.armL=line(g,2.2); E.armR=line(g,2.2);
  E.handL=mk("circle",{r:1.7,fill:INK},g); E.handR=mk("circle",{r:1.7,fill:INK},g);
  E.head=mk("circle",{r:4.8,fill:INK},g);

  const mkLimb=(kind,side,x)=>({kind,side,hold:null,from:{x,y:0},p:{x,y:0},t:1});
  cols[c.key]={cat:c,col,svg:col.querySelector("svg"),E,holds,
    limbs:{handL:mkLimb("hand",-1,CX-12),handR:mkLimb("hand",1,CX+12),footL:mkLimb("foot",-1,CX-8),footR:mkLimb("foot",1,CX+8)},
    lab:lab.querySelector(".num"),y:yFor(state[c.key]),vy:0,target:yFor(state[c.key]),dragging:false,level:state[c.key],phase:i*1.7};
  col.setAttribute("aria-valuenow",state[c.key]);
});

/* ---------- climbing ---------- */
function ik(sx,sy,tx,ty,l1,l2,pick){
  let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||.001;
  const maxd=(l1+l2)*.995;
  if(d>maxd){tx=sx+dx/d*maxd;ty=sy+dy/d*maxd;dx=tx-sx;dy=ty-sy;d=maxd}
  const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const mx=sx+dx/d*a,my=sy+dy/d*a,px=-dy/d*h,py=dx/d*h;
  return {elbow:pick({x:mx+px,y:my+py},{x:mx-px,y:my-py},{x:sx,y:sy},{x:tx,y:ty}),end:{x:tx,y:ty}};
}
function pickHold(C,L,otherHold,o){
  const hand=L.kind==="hand", reach=(hand?ARM_R:LEG_R)-3;
  const ix=o.x+L.side*(hand?13:9), iy=hand?o.y-25:o.y+31;
  let best=null,bd=1e9;
  for(const h of C.holds){
    if(h===otherHold||h===L.hold) continue;
    if(hand? h.y>o.y-6 : h.y<o.y+14) continue;
    if(Math.hypot(h.x-o.x,h.y-o.y)>reach) continue;
    if(L.side<0? h.x>o.x+7 : h.x<o.x-7) continue;
    const d=Math.hypot(h.x-ix,h.y-iy);
    if(d<bd){bd=d;best=h}
  }
  return best;
}
const pairOf={handL:"handR",handR:"handL",footL:"footR",footR:"footL"};

function frame(C,t,dt){
  const E=C.E;
  // spring: follows the finger while dragging, overshoots and settles on release
  const k=C.dragging?.2:.085, damp=C.dragging?.68:.8;
  C.vy+=(C.target-C.y)*k*dt; C.vy*=Math.pow(damp,dt); C.y+=C.vy*dt;
  const y=C.y, vy=C.vy;

  // body: sways with speed, weight drifts toward the planted feet
  const feetX=(C.limbs.footL.p.x+C.limbs.footR.p.x)/2;
  const bx=CX+clamp(-vy*.5,-6,6)+Math.sin(t*1.3+C.phase)*.9+(feetX-CX)*.1;
  const hipY=y+13, shY=y-12+Math.sin(t*2.1+C.phase)*.3, lean=clamp(vy*.3,-3,3);
  const shx=bx+lean;
  const origin={handL:{x:shx,y:shY+1},handR:{x:shx,y:shY+1},footL:{x:bx-2,y:hipY},footR:{x:bx+2,y:hipY}};

  // limbs: stay planted, step one at a time with a little lift
  for(const key in C.limbs){
    const L=C.limbs[key],o=origin[key],other=C.limbs[pairOf[key]],hand=L.kind==="hand",reach=hand?ARM_R:LEG_R;
    let want=false;
    if(!L.hold) want=L.t>=1;
    else if(L.t>=1){
      const d=Math.hypot(L.hold.x-o.x,L.hold.y-o.y);
      const wrong=hand? L.hold.y>o.y-3 : L.hold.y<o.y+8;
      const hard=d>reach*1.04 || (hand? L.hold.y>o.y+8 : L.hold.y<o.y-2);
      const soft=d>reach*.95 || wrong;
      want=hard || (soft && other.t>=1);
    }
    if(want){
      const nh=pickHold(C,L,other.hold,o);
      if(nh){L.from={x:L.p.x,y:L.p.y};L.hold=nh;L.t=0}
    }
    if(L.hold){
      if(L.t<1){
        L.t=Math.min(1,L.t+(.09+Math.min(.3,Math.abs(vy)*.035))*dt);
        const e=L.t*L.t*(3-2*L.t), lift=Math.sin(Math.PI*L.t), amp=hand?1:1.8;
        L.p.x=L.from.x+(L.hold.x-L.from.x)*e+L.side*lift*1.6*amp;
        L.p.y=L.from.y+(L.hold.y-L.from.y)*e-lift*2.2*amp;
        L.lift=lift;
      }else{L.p.x=L.hold.x;L.p.y=L.hold.y;L.lift=0}
    }else{
      const tx=o.x+L.side*(hand?12:8), ty=o.y+(hand?-24:30), e=Math.min(1,.2*dt);
      L.p.x+=(tx-L.p.x)*e;L.p.y+=(ty-L.p.y)*e;L.lift=0;
    }
  }

  // draw the stick figure
  E.torso.setAttribute("points",`${f(shx)},${f(shY)} ${f(bx)},${f(hipY)}`);
  const hx=shx+lean*.5, hy=shY-8;
  E.head.setAttribute("cx",f(hx));E.head.setAttribute("cy",f(hy));
  // elbows hang down and out; knees point up and out. Never flipped the wrong way.
  const armPick=side=>(a,b,s,e)=>{const my=(s.y+e.y)/2,mx=(s.x+e.x)/2;
    const sc=c=>(c.y-my)*.8+side*(c.x-mx)*.5-(c.y<Math.min(s.y,e.y)-.5?100:0);return sc(a)>=sc(b)?a:b};
  const legPick=side=>(a,b,s,e)=>{const my=(s.y+e.y)/2,mx=(s.x+e.x)/2;
    const sc=c=>side*(c.x-mx)+(my-c.y)*.8-(c.y>Math.max(s.y,e.y)+.5?100:0);return sc(a)>=sc(b)?a:b};
  [["handL","armL",-1],["handR","armR",1]].forEach(([k,ar,side])=>{
    const s={x:shx,y:shY+1},p=C.limbs[k].p, r=ik(s.x,s.y,p.x,p.y,ARM1,ARM2,armPick(side));
    E[ar].setAttribute("points",`${f(s.x)},${f(s.y)} ${f(r.elbow.x)},${f(r.elbow.y)} ${f(r.end.x)},${f(r.end.y)}`);
    E[k].setAttribute("cx",f(r.end.x));E[k].setAttribute("cy",f(r.end.y));
  });
  [["footL","legL",-1],["footR","legR",1]].forEach(([k,lg,side])=>{
    const L=C.limbs[k],s={x:bx+side*1.8,y:hipY};
    const ankle={x:L.p.x,y:L.p.y-2};   // ball of the foot sits on the hold
    const r=ik(s.x,s.y,ankle.x,ankle.y,LEG1,LEG2,legPick(side));
    E[lg].setAttribute("points",`${f(s.x)},${f(s.y)} ${f(r.elbow.x)},${f(r.elbow.y)} ${f(r.end.x)},${f(r.end.y)}`);
    const tilt=(L.lift||0)*2.4;           // toe points down on the hold, lifts while stepping
    E["foot"+(side<0?"L":"R")].setAttribute("points",`${f(r.end.x)},${f(r.end.y)} ${f(r.end.x+side*4.2)},${f(r.end.y+1.6-tilt)}`);
  });

  // ropes
  const rsx=clamp(-vy*1.6,-22,22)+Math.sin(t*1.7+C.phase)*2.4;
  E.rope.setAttribute("d",`M${CX} 12Q${f((CX+bx)/2+rsx)} ${f((12+hipY)/2)} ${f(bx)} ${f(hipY)}`);
  const sx=CX+26+Math.sin(t*1.1+C.phase)*3+rsx*.2;
  E.slack.setAttribute("d",`M${CX} 12C${f(CX+10)} ${f(H*.3)} ${f(sx+14)} ${f(H*.45)} ${f(sx)} ${f(H-18)}`);

  const fill=C.col.querySelector(".fill");fill.setAttribute("y",f(y));fill.setAttribute("height",f(Math.max(0,H-y)));
}

/* ---------- interaction ---------- */
function setLevel(C,l){
  if(l===C.level) return;
  C.level=l;state[C.cat.key]=l;
  C.lab.textContent=l;C.lab.classList.add("pulse");setTimeout(()=>C.lab.classList.remove("pulse"),160);
  C.col.setAttribute("aria-valuenow",l);
}
CATS.forEach(c=>{
  const C=cols[c.key];
  const yFrom=ev=>{const r=C.svg.getBoundingClientRect();return clamp((ev.clientY-r.top)*H/r.height,TOP,BOT)};
  C.col.addEventListener("pointerdown",ev=>{C.dragging=true;C.col.setPointerCapture(ev.pointerId);C.col.style.cursor="grabbing";C.target=yFrom(ev);setLevel(C,levelFor(C.target))});
  C.col.addEventListener("pointermove",ev=>{if(!C.dragging)return;C.target=yFrom(ev);setLevel(C,levelFor(C.target))});
  const end=()=>{if(!C.dragging)return;C.dragging=false;C.col.style.cursor="grab";C.target=yFor(C.level);lsSet(CURKEY,state)};
  C.col.addEventListener("pointerup",end);C.col.addEventListener("pointercancel",end);
  C.col.addEventListener("keydown",ev=>{
    let d=0;if(ev.key==="ArrowUp"||ev.key==="ArrowRight")d=1;if(ev.key==="ArrowDown"||ev.key==="ArrowLeft")d=-1;
    if(!d)return;ev.preventDefault();setLevel(C,clamp(C.level+d,1,LEVELS));C.target=yFor(C.level);lsSet(CURKEY,state);
  });
});

let last=performance.now();
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.667);last=now;
  for(const k in cols) frame(cols[k],now/1000,dt);
  requestAnimationFrame(loop);
}
CATS.forEach(c=>{const C=cols[c.key];for(let i=0;i<40;i++)frame(C,0,1)});
requestAnimationFrame(loop);

/* ---------- save / journal ---------- */
const msg=document.getElementById("msg");
function say(t){msg.textContent=t;setTimeout(()=>{if(msg.textContent===t)msg.innerHTML="&nbsp;"},2500)}
const esc=t=>String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function renderLog(){
  const log=lsGet(LOGKEY)||[],box=document.getElementById("log");
  if(!log.length){box.innerHTML='<div class="hint">No check-ins saved yet.</div>';return}
  box.innerHTML=log.slice().reverse().slice(0,30).map(en=>{
    const d=new Date(en.t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    const dots=CATS.map(c=>`<span class="dot"><i style="background:${c.color}"></i>${en.v[c.key]}</span>`).join("");
    return `<div class="entry"><div class="row"><span class="d">${d}</span><span class="dots">${dots}</span><button class="x" data-t="${en.t}" aria-label="Delete entry">&times;</button></div>${en.note?`<p class="note">${esc(en.note)}</p>`:""}</div>`;
  }).join("");
}
renderLog();
const noteEl=document.getElementById("note");
const draft=lsGet(DRAFTKEY); if(typeof draft==="string") noteEl.value=draft;
noteEl.addEventListener("input",()=>lsSet(DRAFTKEY,noteEl.value));
document.getElementById("log").addEventListener("click",ev=>{
  const b=ev.target.closest("button.x"); if(!b) return;
  const t=Number(b.dataset.t); lsSet(LOGKEY,(lsGet(LOGKEY)||[]).filter(e=>e.t!==t)); renderLog();
});
document.getElementById("save").onclick=()=>{
  const log=lsGet(LOGKEY)||[];
  log.push({t:Date.now(),v:{...state},note:noteEl.value.trim()});
  lsSet(LOGKEY,log.slice(-200));
  noteEl.value="";lsSet(DRAFTKEY,"");
  renderLog();say("Check-in saved.");
};
document.getElementById("reset").onclick=()=>{
  CATS.forEach(c=>{const C=cols[c.key];setLevel(C,1);C.target=yFor(1)});
  lsSet(CURKEY,state);say("Climbers reset.");
};
</script>
</body>
</html>
